[project]
name = "rl-learning"
version = "0.1.0"
description = "Hands-on curriculum: Q-learning, DQN, PPO and DDPG on CartPole, Acrobot and Pendulum"
requires-python = ">=3.10,<3.13"
dependencies = [
    "gymnasium[atari,box2d,classic-control]>=1.0",
    "torch>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "moviepy>=1.0.3,<2",
    "imageio>=2.30",
    "tensorboard>=2.21.0",
    "opencv-python-headless<4.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rlkit"]
